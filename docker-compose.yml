services:
  creator-studio:
    build:
      context: .
      dockerfile: Dockerfile
    image: creator-studio:latest
    container_name: creator-studio
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CREATOR_STUDIO_DATA_DIR: /app/studio_runtime
      CREATOR_STUDIO_PUBLIC_BASE_URL: ${CREATOR_STUDIO_PUBLIC_BASE_URL:-http://43.156.8.162}
    ports:
      - "${CREATOR_STUDIO_HOST_PORT:-80}:8000"
    volumes:
      - ./studio_runtime:/app/studio_runtime
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
